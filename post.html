<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post · Abid Jawad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="post">
    <div class="background-grid"></div>
    <main class="shell">
      <aside class="left-panel" data-partial="left" data-page="post"></aside>

      <section class="middle-panel">
        <div class="panel post-panel">
          <a class="ghost-link back-link" href="blog.html" data-shell-link>← Back to blog</a>
          <p class="eyebrow" id="postCategory" aria-busy="true"><span class="sk sk-chip"></span></p>
          <h1 id="postTitle" aria-busy="true"><span class="sk sk-title"></span><span class="sk sk-title sk-title-2"></span></h1>
          <p class="post-meta" id="postMeta" aria-busy="true"><span class="sk sk-meta"></span></p>
          <article class="post-card" id="postContent" aria-busy="true">
            <div class="post-skeleton" aria-hidden="true">
              <span class="sk sk-h"></span>
              <span class="sk sk-line"></span><span class="sk sk-line"></span><span class="sk sk-line sk-line-short"></span>
              <span class="sk sk-block"></span>
              <span class="sk sk-line"></span><span class="sk sk-line sk-line-short"></span>
            </div>
          </article>
          <div class="reactions-wrapper is-pending">
            <div class="reactions-header">
              <p class="reactions-header-text eyebrow">Reactions</p>
            </div>
            <div class="reactions-grid" id="reactionsContainer"></div>
          </div>
          <div class="comments-wrapper is-pending" id="comments" tabindex="-1">
            <div class="comments-header">
              <p class="comments-header-text eyebrow">Comments</p>
            </div>
            <div id="graphcomment"></div>
          </div>
        </div>
      </section>

      <section class="right-panel" data-partial="right" data-page="post"></section>
    </main>
    <script src="main.js"></script>
    <script>
      window.goatcounter = { path: function() {
        var slug = new URLSearchParams(location.search).get('slug');
        return slug ? '/post/' + slug : location.pathname + location.search;
      }};
    </script>
    <script data-goatcounter="https://hurutta.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
